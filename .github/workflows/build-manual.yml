---
# Build sob demanda do binario Linux, sem passar pelo portao de formatacao.
#
# POR QUE EXISTE. O ci.yml so compila se o job "checks" passar, e esse job
# roda o stylua sobre o repositorio inteiro -- que aqui pede reformatacao de
# ~5400 arquivos do datapack. Reformatar tudo para conseguir um binario seria
# uma mudanca enorme e arriscada num datapack que esta em producao, e sem
# relacao nenhuma com o que se quer compilar.
#
# Este workflow chama o MESMO build reutilizavel do ci.yml, com os mesmos
# testes de fumaca. O que ele pula e' so a formatacao.
#
# Uso: Actions -> Build manual (Linux) -> Run workflow, escolhendo a branch.
# O binario sai no artefato "canary-linux-release".

name: Build manual (Linux)

on:
  # Por push tambem: o workflow_dispatch so aparece depois que o arquivo esta
  # na branch padrao, e nao vale mexer na branch padrao so para conseguir
  # compilar uma branch de trabalho. Restrito a src/ para nao gastar um build
  # a cada commit de script ou documentacao.
  push:
    branches:
      - "claude/**"
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - ".github/workflows/build-manual.yml"
      # docs/lua-api entra porque o build CONFERE se ela esta em dia com os
      # bindings, e o passo roda depois de compilar. Um binding novo derruba o
      # build ali; a correcao mexe so' em docs, nao dispara build nenhum, e o
      # conserto fica parado sem ninguem entender por que. Aconteceu com o
      # Game.unloadMapChunk.
      - "docs/lua-api/**"
  workflow_dispatch:
    inputs:
      buildtypes:
        description: Presets a compilar (JSON).
        required: false
        type: string
        default: '["linux-release"]'
      run_canary_smoke:
        description: Rodar o teste de fumaca do data-canary.
        required: false
        type: boolean
        default: false
      run_global_smoke:
        description: Rodar o teste de fumaca do data-otservbr-global.
        required: false
        type: boolean
        default: true

jobs:
  build-linux:
    name: Build - Linux
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/reusable-build-linux.yml
    with:
      # No evento push os inputs vem vazios, entao cada um precisa de um
      # padrao que funcione nos dois gatilhos sem anular a escolha de quem
      # dispara a mao.
      buildtypes: ${{ inputs.buildtypes || '["linux-release"]' }}
      run_canary_smoke: ${{ inputs.run_canary_smoke == true }}
      run_global_smoke: ${{ inputs.run_global_smoke != false }}
    secrets: inherit
