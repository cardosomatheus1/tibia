<meta charset="utf-8">
<title>Mapeador de Hunts</title>
<style>
:root{--bg:#16161a;--pnl:#22222a;--bd:#34343f;--tx:#dcdce4;--dim:#8a8a99;
      --am:#ffd23f;--az:#3fa9ff;--vm:#ff4d4d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
     font:13px system-ui,-apple-system,sans-serif;overflow:hidden}
#topo{position:fixed;inset:0 0 auto 0;height:52px;background:var(--pnl);
      border-bottom:1px solid var(--bd);display:flex;align-items:center;
      gap:10px;padding:0 12px;z-index:20}
#lado{position:fixed;top:52px;bottom:0;right:0;width:280px;background:var(--pnl);
      border-left:1px solid var(--bd);padding:12px;overflow:auto;z-index:15}
#palco{position:fixed;top:52px;left:0;right:280px;bottom:0;overflow:hidden;
       cursor:crosshair;background:#0d0d10}
#mundo{position:absolute;transform-origin:0 0;will-change:transform}
canvas{position:absolute;top:0;left:0;image-rendering:pixelated}
button{background:#33333d;color:var(--tx);border:1px solid var(--bd);
       padding:6px 11px;border-radius:5px;cursor:pointer;font-size:13px}
button:hover{background:#3f3f4b}
button.on{outline:2px solid currentColor}
#bObel{color:var(--am)} #bIni{color:var(--az)} #bLim{color:var(--vm)}
input,select{background:#2c2c36;color:var(--tx);border:1px solid var(--bd);
             padding:6px 8px;border-radius:5px;font-size:13px}
#coord{font:13px ui-monospace,monospace;color:#7fd1ff;min-width:190px}
h3{margin:14px 0 6px;font-size:12px;text-transform:uppercase;
   letter-spacing:.05em;color:var(--dim)}
.linha{display:flex;gap:6px;align-items:center;margin:5px 0}
.chip{display:inline-block;width:11px;height:11px;border-radius:2px;
      margin-right:6px;vertical-align:-1px}
#lista{font-size:12px;line-height:1.7}
#aviso{color:#ffb454;font-size:12px;margin-top:8px;line-height:1.5}
textarea{width:100%;height:120px;background:#1a1a20;color:var(--tx);
         border:1px solid var(--bd);border-radius:5px;font:11px ui-monospace,monospace}
</style>

<div id="topo">
  <strong style="color:#7fd1ff">Mapeador</strong>
  <label>Hunt <input id="huntId" type="number" min="0" style="width:74px" value="0"></label>
  <input id="huntNome" placeholder="nome da hunt" style="width:200px">
  <label>Andar <select id="andar"></select></label>
  <span id="coord">—</span>
  <span style="margin-left:auto">
    <button onclick="zoom(1.4)">+</button>
    <button onclick="zoom(1/1.4)">−</button>
    <button onclick="irPara()">ir para…</button>
  </span>
</div>

<div id="palco"><div id="mundo">
  <canvas id="cMapa"></canvas>
  <canvas id="cMarca"></canvas>
</div></div>

<div id="lado">
  <h3>Ferramenta</h3>
  <div class="linha">
    <button id="bMov" onclick="setFerr(null)">✋ Mover <small>(Esc)</small></button>
  </div>
  <div class="linha">
    <button id="bObel" onclick="setFerr('obelisco')">Obelisco</button>
    <button id="bIni"  onclick="setFerr('inicio')">Início</button>
  </div>
  <div class="linha">
    <button id="bLim"  onclick="setFerr('limite')">Pintar limites</button>
    <button id="bApa" onclick="setFerr('apagar')">Apagar</button>
  </div>
  <div class="linha">
    <button id="bVar" onclick="setFerr('varinha')">✨ Varinha</button>
    <label>raio <input id="raio" type="number" min="5" max="200" value="60" style="width:58px"></label>
  </div>
  <div class="linha">
    <label>Pincel <input id="pincel" type="number" min="1" max="40" value="6" style="width:56px"></label>
    <button onclick="limparAndar()">Limpar andar</button>
  </div>
  <div id="aviso"></div>

  <h3>Marcado</h3>
  <div id="lista"></div>

  <h3>Monstros</h3>
  <div class="linha">
    <label><input type="checkbox" id="verMon" checked> mostrar</label>
    <input id="filtroMon" placeholder="filtrar por nome" style="flex:1">
  </div>
  <div id="contMon" style="font-size:12px;color:var(--dim)"></div>

  <h3>Hunt aberta</h3>
  <div class="linha">
    <button onclick="marcarRevisada()">✅ Aprovar</button>
    <button onclick="salvarNaPasta()">💾 Salvar rascunho</button>
  </div>
  <div class="linha">
    <button onclick="exportar()">Baixar JSON</button>
    <button onclick="document.getElementById('arq').click()">Abrir JSON</button>
    <input id="arq" type="file" accept=".json" style="display:none" onchange="importar(this)">
  </div>
  <div id="infoRev" style="font-size:12px;color:var(--dim)"></div>
  <div class="linha"><button onclick="carregarExemplo()">Carregar exemplo (Ciclopes)</button></div>

  <h3>Salvas (rascunho)</h3>
  <div class="linha">
    <select id="selSalva" style="flex:1"></select>
    <button onclick="abrirSalva()">Abrir</button>
  </div>
  <div class="linha">
    <button onclick="aprovarSalva()">✅ Aprovar a selecionada</button>
  </div>
  <div id="infoSalva" style="font-size:12px;color:var(--dim)"></div>

  <h3>Contornadas sozinhas</h3>
  <div class="linha">
    <select id="filtroConf" onchange="listarAutomaticas()" style="width:96px">
      <option value="">todas</option>
      <option value="alta" selected>alta</option>
      <option value="media">média</option>
      <option value="baixa">baixa</option>
    </select>
    <select id="selAuto" style="flex:1"></select>
  </div>
  <div class="linha"><button onclick="abrirAutomatica()">Abrir a selecionada</button></div>
  <div id="infoAuto" style="font-size:12px;color:var(--dim)"></div>

  <h3>Revisadas (prontas para implementar)</h3>
  <div class="linha">
    <select id="selRev" style="flex:1"></select>
    <button onclick="abrirRevisada()">Abrir</button>
  </div>
  <div id="contaRev" style="font-size:12px;color:var(--dim)"></div>
  <textarea id="resumo" readonly></textarea>
</div>

<script src="atlas/dados.js"></script>
<script>
let LADO = 256;   // tamanho do bloco de imagem, vem do servidor
const cMapa = document.getElementById('cMapa'), gMapa = cMapa.getContext('2d');
const cMarca = document.getElementById('cMarca'), gMarca = cMarca.getContext('2d');
const palco = document.getElementById('palco'), mundo = document.getElementById('mundo');

// ---------------------------------------------------------------- estado
// esc = pixels por tile na tela. Comeca em 6 porque abaixo de 4 o sprite do
// monstro vira borrao e o mapeador troca por pontinhos -- e ver o bicho e' o
// ponto todo da ferramenta.
let z = 7, esc = 6, camX = 32420, camY = 32050;
let ferr = null, pintando = false;
const hunt = { id: 0, nome: '', obelisco: null, inicio: null, limites: {} };

// limites ficam em Set de "x,y" por andar: marcar area grande com array seria
// O(n) para checar duplicata e travaria o arraste
function setDo(zz) {
  const k = String(zz);
  if (!hunt.limites[k]) hunt.limites[k] = new Set();
  return hunt.limites[k];
}

// ------------------------------------------------------------- andares
const selAndar = document.getElementById('andar');
let andares = [];
const porAndar = {};

function montarAndares() {
  andares = [...new Set(ATLAS_AREAS.map(a => a.z))].sort((a, b) => a - b);
  selAndar.innerHTML = '';
  for (const zz of andares) {
    const o = document.createElement('option');
    o.value = zz; o.textContent = 'z ' + zz; selAndar.appendChild(o);
  }
  selAndar.value = z;
  for (const k of Object.keys(porAndar)) delete porAndar[k];
  for (const a of ATLAS_AREAS) (porAndar[a.z] ||= new Set()).add(a.ax + ',' + a.ay);
}
selAndar.onchange = () => { z = +selAndar.value; desenhar(); };
if (typeof ATLAS_AREAS !== 'undefined') montarAndares();

// Monstros indexados por bloco de 256, senao cada frame percorreria os ~50 mil
// spawns do andar -- durante a pintura isso trava o arraste.
const idxMon = {};
function indexarMonstros() {
  for (const [zz, lista] of Object.entries(ATLAS_MONSTROS.porAndar || {})) {
    const b = idxMon[zz] = {};
    for (const m of lista) {
      const k = Math.floor(m[0] / LADO) + ',' + Math.floor(m[1] / LADO);
      (b[k] ||= []).push(m);
    }
  }
}
if (typeof ATLAS_MONSTROS !== 'undefined') indexarMonstros();

function* monstrosVisiveis(zz, cx, cy, tw, th) {
  const b = idxMon[String(zz)]; if (!b) return;
  for (let ax = Math.floor(cx / LADO); ax <= Math.floor((cx + tw) / LADO); ax++)
    for (let ay = Math.floor(cy / LADO); ay <= Math.floor((cy + th) / LADO); ay++) {
      const lista = b[ax + ',' + ay]; if (!lista) continue;
      for (const m of lista)
        if (m[0] >= cx - 1 && m[0] <= cx + tw && m[1] >= cy - 1 && m[1] <= cy + th)
          yield m;
    }
}

// Nivel de detalhe: quantos pixels por tile pedir ao servidor. Pedir sempre
// os 32 px/tile do sprite fazia o navegador decodificar ~200 megapixels por
// tela para desenhar 1120x848 -- era a maior parte da lentidao. O servidor
// reduz do lado dele e manda so o que cabe na tela.
function nivel() {
  let p = 1;
  while (p < esc && p < 16) p *= 2;
  return Math.max(2, p);
}

const cacheImg = new Map();       // "z/ax_ay@p" -> Image
const niveisDe = new Map();       // "z/ax_ay"   -> Set de p ja carregados

// No modo servidor o bloco e' menor e nao existe indice previo: qualquer
// bloco pode ter conteudo, e o servidor renderiza sob demanda.
function imagem(zz, ax, ay, p) {
  const base = zz + '/' + ax + '_' + ay;
  const k = base + '@' + p;
  if (cacheImg.has(k)) return cacheImg.get(k);
  if (!MODO_SERVIDOR && (!porAndar[zz] || !porAndar[zz].has(ax + ',' + ay))) {
    cacheImg.set(k, null); return null;
  }
  const im = new Image();
  im.onload = () => {
    if (!niveisDe.has(base)) niveisDe.set(base, new Set());
    niveisDe.get(base).add(p);
    pedirDesenho();
  };
  im.onerror = () => { cacheImg.set(k, null); };
  im.src = MODO_SERVIDOR
    ? `/tile/${zz}/${ax}_${ay}/${p}.jpg`
    : 'atlas/tiles/' + zz + '/' + ax + '_' + ay + '.png';
  cacheImg.set(k, im);
  return im;
}

/** O melhor bloco JA carregado. Ao dar zoom o nivel novo demora a chegar;
 *  sem isto a tela piscaria em preto a cada passo da roda do mouse. */
function melhorImagem(zz, ax, ay, p) {
  const im = imagem(zz, ax, ay, p);
  if (im && im.complete && im.naturalWidth) return im;
  const base = zz + '/' + ax + '_' + ay;
  const tem = niveisDe.get(base);
  if (!tem) return null;
  let melhor = null, dist = 1e9;
  for (const q of tem) {
    const d = Math.abs(Math.log2(q) - Math.log2(p));
    if (d < dist) { dist = d; melhor = cacheImg.get(base + '@' + q); }
  }
  return melhor && melhor.complete && melhor.naturalWidth ? melhor : null;
}

// Sprites de monstro, um PNG por tipo. Sao poucos por regiao e o navegador
// guarda tudo em cache depois da primeira vez.
const spriteMon = new Map();
function spriteMonstro(ni) {
  if (spriteMon.has(ni)) return spriteMon.get(ni);
  if (!MODO_SERVIDOR) { spriteMon.set(ni, null); return null; }
  const im = new Image();
  im.onload = () => pedirDesenho();
  im.onerror = () => spriteMon.set(ni, null);
  im.src = `/monstro/${ni}.png`;
  spriteMon.set(ni, im);
  return im;
}

// Redesenho coalescido: arrastar dispara dezenas de mousemove por segundo e
// cada um refazia a tela inteira. Um por quadro basta.
let pedido = false;
function pedirDesenho() {
  if (pedido) return;
  pedido = true;
  requestAnimationFrame(() => { pedido = false; desenhar(); });
}

// -------------------------------------------------------------- desenho
function dims() {
  return { w: palco.clientWidth, h: palco.clientHeight,
           tw: Math.ceil(palco.clientWidth / esc), th: Math.ceil(palco.clientHeight / esc) };
}

function desenhar() {
  const { w, h, tw, th } = dims();
  // so redimensiona quando muda de verdade: atribuir width/height realoca e
  // limpa o canvas, e fazer isso a cada quadro do arraste custa caro
  if (cMapa.width !== w || cMapa.height !== h)
    for (const c of [cMapa, cMarca]) { c.width = w; c.height = h; }
  gMapa.imageSmoothingEnabled = esc < 8;   // suaviza so quando esta reduzindo
  gMapa.clearRect(0, 0, w, h);

  const p = nivel();
  const ax0 = Math.floor(camX / LADO), ax1 = Math.floor((camX + tw) / LADO);
  const ay0 = Math.floor(camY / LADO), ay1 = Math.floor((camY + th) / LADO);
  for (let ax = ax0; ax <= ax1; ax++) {
    for (let ay = ay0; ay <= ay1; ay++) {
      const im = melhorImagem(z, ax, ay, p);
      if (!im) continue;
      gMapa.drawImage(im, (ax * LADO - camX) * esc, (ay * LADO - camY) * esc,
                      LADO * esc, LADO * esc);
    }
  }
  desenharMarcas();
}

function px(x, y) { return [(x - camX) * esc, (y - camY) * esc]; }

function desenharMarcas() {
  const { w, h, tw, th } = dims();
  gMarca.clearRect(0, 0, w, h);

  // limites
  const s = hunt.limites[String(z)];
  if (s) {
    gMarca.fillStyle = 'rgba(255,77,77,.42)';
    for (const k of s) {
      const [x, y] = k.split(',').map(Number);
      if (x < camX - 1 || x > camX + tw || y < camY - 1 || y > camY + th) continue;
      const [px_, py] = px(x, y);
      gMarca.fillRect(px_, py, esc, esc);
    }
  }

  // monstros -- sao o que permite enxergar onde a hunt esta, entao desenham
  // por cima de tudo. Com o sprite de verdade da para reconhecer o bicho e o
  // tamanho que ele ocupa: 64x64 cobre 2x2 tiles, ancorado no canto inferior
  // direito, igual ao jogo. Abaixo de 4 px por tile o sprite vira um borrao,
  // e um ponto colorido informa mais.
  if (document.getElementById('verMon').checked) {
    const filtro = document.getElementById('filtroMon').value.trim().toLowerCase();
    const comSprite = esc >= 4;
    gMarca.imageSmoothingEnabled = esc < 16;
    const t = Math.max(3, Math.min(esc, 10));
    const tipos = {};
    let n = 0;
    for (const [x, y, ni] of monstrosVisiveis(z, camX, camY, tw, th)) {
      const nome = ATLAS_MONSTROS.nomes[ni];
      if (filtro && !nome.toLowerCase().includes(filtro)) continue;
      const [px_, py] = px(x, y);
      const im = comSprite ? spriteMonstro(ni) : null;
      if (im && im.complete && im.naturalWidth) {
        const ct = im.naturalWidth / 32, cl = im.naturalHeight / 32;
        if (filtro) {                       // realce atras do sprite filtrado
          gMarca.fillStyle = 'rgba(255,225,77,.45)';
          gMarca.fillRect(px_, py, esc, esc);
        }
        gMarca.drawImage(im, px_ - (ct - 1) * esc, py - (cl - 1) * esc,
                         ct * esc, cl * esc);
      } else {
        gMarca.fillStyle = 'rgba(0,0,0,.55)';
        gMarca.fillRect(px_ - 1, py - 1, t + 2, t + 2);
        gMarca.fillStyle = filtro ? '#ffe14d' : '#5dff8a';
        gMarca.fillRect(px_, py, t, t);
      }
      tipos[nome] = (tipos[nome] || 0) + 1;
      n++;
    }
    const top = Object.entries(tipos).sort((a, b) => b[1] - a[1]).slice(0, 8);
    document.getElementById('contMon').innerHTML =
      `<b>${n}</b> spawns na tela<br>` +
      top.map(([nm, c]) => `${c}× ${nm}`).join('<br>');
  } else {
    document.getElementById('contMon').textContent = '';
  }

  // obelisco e inicio: translucidos, para ver o que ha atras
  marcaPonto(hunt.obelisco, 'rgba(255,210,63,.55)', '#ffd23f', 'O');
  marcaPonto(hunt.inicio,   'rgba(63,169,255,.55)', '#3fa9ff', 'I');
}

function marcaPonto(p, preench, borda, letra) {
  if (!p || p.z !== z) return;
  const [x, y] = px(p.x, p.y);
  const t = Math.max(esc, 9);
  gMarca.fillStyle = preench;
  gMarca.fillRect(x - t / 2 + esc / 2, y - t / 2 + esc / 2, t, t);
  gMarca.strokeStyle = borda; gMarca.lineWidth = 2;
  gMarca.strokeRect(x - t / 2 + esc / 2, y - t / 2 + esc / 2, t, t);
  gMarca.fillStyle = '#000'; gMarca.font = 'bold 10px system-ui';
  gMarca.fillText(letra, x + esc / 2 - 3, y + esc / 2 + 4);
}

// ------------------------------------------------------------ interacao
function tileDoEvento(e) {
  const r = palco.getBoundingClientRect();
  return [Math.floor(camX + (e.clientX - r.left) / esc),
          Math.floor(camY + (e.clientY - r.top) / esc)];
}

// Varinha: o servidor anda a pe a partir do clique e devolve so o que se
// alcanca naquele andar, mais a parede em volta. E' o que substitui o
// retangulo -- que pegava grama, rocha macica e area fora da caverna.
let varinhaOcupada = false;
async function varinha(x, y) {
  if (varinhaOcupada) return;
  varinhaOcupada = true;
  const aviso = document.getElementById('aviso');
  aviso.textContent = 'Contornando a area...';
  try {
    const raio = Math.max(5, Math.min(200, +document.getElementById('raio').value || 60));
    const r = await (await fetch(`/preencher/${z}/${x}/${y}/${raio}`)).json();
    if (r.erro) { aviso.textContent = r.erro; return; }
    const s = setDo(z);
    for (const [tx, ty] of r.tiles) s.add(tx + ',' + ty);
    aviso.textContent = `${r.pisavel} tiles pisáveis + parede = ${r.comMargem}`
      + ` (raio ${r.raio})`;
    pedirMarcas(); atualizarPainel();
  } catch (e) {
    aviso.textContent = 'Falhou: ' + e.message;
  } finally {
    varinhaOcupada = false;
  }
}

function aplicar(x, y) {
  if (ferr === 'varinha') { varinha(x, y); setFerr(null); }
  else if (ferr === 'obelisco') { hunt.obelisco = { x, y, z }; setFerr(null); }
  else if (ferr === 'inicio') { hunt.inicio = { x, y, z }; setFerr(null); }
  else if (ferr === 'limite' || ferr === 'apagar') {
    const r = Math.max(1, +document.getElementById('pincel').value) - 1;
    const s = setDo(z);
    const meio = Math.floor(r / 2);
    for (let dx = -meio; dx <= r - meio; dx++)
      for (let dy = -meio; dy <= r - meio; dy++) {
        const k = (x + dx) + ',' + (y + dy);
        if (ferr === 'limite') s.add(k); else s.delete(k);
      }
  }
  pedirMarcas(); atualizarPainel();
}

// O mesmo motivo do pedirDesenho: pintar dispara um evento por pixel do
// mouse, e cada um redesenhava a camada de marcas inteira.
let pedidoMarcas = false;
function pedirMarcas() {
  if (pedidoMarcas) return;
  pedidoMarcas = true;
  requestAnimationFrame(() => { pedidoMarcas = false; desenharMarcas(); });
}

// O resumo conta os monstros dentro dos limites -- uma varredura sobre os
// ~12 mil spawns de cada andar pintado. Rodava a cada quadro do desenho e
// era o que mais travava o arraste. Agora so roda quando a marcacao muda, e
// mesmo assim depois que a mao para.
let adiado = 0;
function atualizarPainel() {
  atualizarLista();
  clearTimeout(adiado);
  adiado = setTimeout(() => {
    document.getElementById('resumo').value = resumoTexto();
    guardarHunt();          // salva junto: pintar ja e' o gatilho de gravar
  }, 300);
}

palco.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  const [x, y] = tileDoEvento(e);
  if (ferr) { pintando = true; aplicar(x, y); e.preventDefault(); }
  else { arrastando = true; ax0 = e.clientX; ay0 = e.clientY; cx0 = camX; cy0 = camY; }
});
let arrastando = false, ax0 = 0, ay0 = 0, cx0 = 0, cy0 = 0;

palco.addEventListener('mousemove', e => {
  const [x, y] = tileDoEvento(e);
  document.getElementById('coord').textContent = `${x}, ${y}, ${z}`;
  if (pintando) aplicar(x, y);
  else if (arrastando) {
    camX = Math.round(cx0 - (e.clientX - ax0) / esc);
    camY = Math.round(cy0 - (e.clientY - ay0) / esc);
    pedirDesenho();
  }
});
addEventListener('mouseup', () => { pintando = false; arrastando = false; });

palco.addEventListener('wheel', e => {
  e.preventDefault();
  const r = palco.getBoundingClientRect();
  const mx = camX + (e.clientX - r.left) / esc, my = camY + (e.clientY - r.top) / esc;
  esc = Math.min(16, Math.max(0.5, esc * (e.deltaY < 0 ? 1.25 : 0.8)));
  camX = Math.round(mx - (e.clientX - r.left) / esc);
  camY = Math.round(my - (e.clientY - r.top) / esc);
  pedirDesenho();
}, { passive: false });

function zoom(f) { esc = Math.min(16, Math.max(0.5, esc * f)); pedirDesenho(); }

function irPara() {
  const v = prompt('Coordenada (x y z) ou (x,y,z):', `${camX + 40} ${camY + 30} ${z}`);
  if (!v) return;
  const n = v.split(/[\s,]+/).map(Number).filter(x => !isNaN(x));
  if (n.length < 2) return;
  camX = n[0] - 40; camY = n[1] - 30;
  if (n.length > 2 && andares.includes(n[2])) { z = n[2]; selAndar.value = z; }
  desenhar();
}

function setFerr(f) {
  ferr = (ferr === f) ? null : f;
  for (const [id, nome] of [['bMov', null], ['bObel', 'obelisco'],
                            ['bIni', 'inicio'], ['bLim', 'limite'],
                            ['bApa', 'apagar'], ['bVar', 'varinha']])
    document.getElementById(id).classList.toggle('on', ferr === nome);
  const t = { obelisco: 'Clique onde fica o obelisco. Uma vez por hunt.',
              inicio: 'Clique onde a hunt começa. Uma vez por hunt.',
              limite: 'Segure o botão e arraste para pintar os limites.',
              apagar: 'Segure e arraste para apagar limites.',
              varinha: 'Clique DENTRO da área, num tile pisável. Preenche o que '
                     + 'se alcança a pé naquele andar dentro do raio, mais 2 '
                     + 'tiles de parede. Em caverna a parede para antes; ao ar '
                     + 'livre quem limita é o raio. Repita em cada andar.' };
  document.getElementById('aviso').textContent = ferr
    ? t[ferr] + ' Esc ou botão direito volta a mover o mapa.'
    : 'Arrastar move o mapa. Roda do mouse dá zoom.';
  palco.style.cursor = ferr ? 'crosshair' : 'grab';
}

// Sair da ferramenta sem ter de achar o botao: Esc, ou botao direito no mapa.
addEventListener('keydown', e => {
  if (e.key === 'Escape' && ferr) { setFerr(null); e.preventDefault(); }
});
palco.addEventListener('contextmenu', e => {
  if (!ferr) return;
  e.preventDefault();
  pintando = false;
  setFerr(null);
});

function limparAndar() {
  if (!confirm('Apagar todos os limites do andar ' + z + '?')) return;
  delete hunt.limites[String(z)];
  atualizarLista(); desenharMarcas();
}

// --------------------------------------------------------------- painel
function atualizarLista() {
  const l = [];
  l.push(hunt.obelisco
    ? `<span class="chip" style="background:var(--am)"></span>obelisco ${hunt.obelisco.x}, ${hunt.obelisco.y}, z${hunt.obelisco.z}`
    : `<span class="chip" style="background:#444"></span><span style="color:var(--dim)">obelisco não marcado</span>`);
  l.push(hunt.inicio
    ? `<span class="chip" style="background:var(--az)"></span>início ${hunt.inicio.x}, ${hunt.inicio.y}, z${hunt.inicio.z}`
    : `<span class="chip" style="background:#444"></span><span style="color:var(--dim)">início não marcado</span>`);
  let tot = 0;
  for (const k of Object.keys(hunt.limites).sort((a, b) => a - b)) {
    const n = hunt.limites[k].size; if (!n) continue;
    tot += n;
    l.push(`<span class="chip" style="background:var(--vm)"></span>z${k}: ${n} tiles`);
  }
  l.push(tot ? `<b>${tot} tiles no total</b>` : `<span style="color:var(--dim)">nenhum limite pintado</span>`);
  document.getElementById('lista').innerHTML = l.join('<br>');
}

function bbox() {
  const cx = {};
  for (const [k, s] of Object.entries(hunt.limites)) {
    if (!s.size) continue;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const p of s) { const [x, y] = p.split(',').map(Number);
      x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    cx[k] = { x0, y0, x1, y1, tiles: s.size };
  }
  return cx;
}

function resumoTexto() {
  const b = bbox(); const ls = [];
  for (const [k, v] of Object.entries(b))
    ls.push(`z${k}: x ${v.x0}-${v.x1}  y ${v.y0}-${v.y1}  (${v.tiles} tiles)`);
  if (!ls.length) return '(sem limites pintados)';
  const org = origemDoRecorte();
  if (org) {
    const m = monstrosDentro(org);
    ls.push('', `origem do recorte: ${org.x}, ${org.y}`);
    ls.push(`${m.total} monstros dentro dos limites`);
    const t = Object.entries(contagemPorTipo(m)).slice(0, 6);
    for (const [nome, n] of t) ls.push(`   ${n}x ${nome}`);
  }
  return ls.join('\n');
}

// -------------------------------------------------------------- arquivo
// Origem do recorte: canto do bbox que engloba TODOS os andares pintados.
// E' a partir dela que sai a coordenada relativa, que e' o que o servidor usa
// (posicao real = origem do slot + relativa).
function origemDoRecorte() {
  const b = bbox(); const vs = Object.values(b);
  if (!vs.length) return null;
  return { x: Math.min(...vs.map(v => v.x0)), y: Math.min(...vs.map(v => v.y0)) };
}

/** Monstros DENTRO dos limites pintados, por andar.
 *  Sem isto o JSON nao basta: daria os limites da hunt mas nao o que nasce
 *  nela, e a lista de spawn teria de ser reextraida a mao depois. */
function monstrosDentro(org) {
  const saida = {}; let total = 0;
  for (const [k, s] of Object.entries(hunt.limites)) {
    if (!s.size) continue;
    const lista = (ATLAS_MONSTROS.porAndar || {})[k] || [];
    const dentro = [];
    for (const [x, y, ni] of lista) {
      if (!s.has(x + ',' + y)) continue;
      dentro.push({ nome: ATLAS_MONSTROS.nomes[ni], x, y, z: +k,
                    rx: x - org.x, ry: y - org.y });
      total++;
    }
    if (dentro.length) saida[k] = dentro;
  }
  return { porAndar: saida, total };
}

function contagemPorTipo(mons) {
  const c = {};
  for (const lista of Object.values(mons.porAndar))
    for (const m of lista) c[m.nome] = (c[m.nome] || 0) + 1;
  return Object.fromEntries(Object.entries(c).sort((a, b) => b[1] - a[1]));
}

function exportar() {
  const saida = montarSaida();
  if (!saida) return;
  const blob = new Blob([JSON.stringify(saida, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `hunt_${saida.id}_${(saida.nome || 'sem_nome').replace(/\W+/g, '_')}.json`;
  a.click();
}

// Gravar na pasta do mapeador. Usa o MESMO documento do "Baixar JSON": se
// fossem dois montadores, um dia divergiriam e o arquivo salvo nao seria o
// mesmo que o baixado -- e ninguem perceberia ate' usar o errado.
async function salvarNaPasta() {
  const saida = montarSaida();
  if (!saida) return;
  const aviso = document.getElementById('aviso');
  try {
    const r = await (await fetch('/salvar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(saida),
    })).json();
    aviso.textContent = r.erro ? 'não salvou: ' + r.erro
                               : `salvo em ${r.pasta}\\${r.arquivo}`;
  } catch (e) { aviso.textContent = 'não salvou: ' + e.message; }
}

function montarSaida() {
  const lim = {};
  for (const [k, s] of Object.entries(hunt.limites))
    if (s.size) lim[k] = [...s].map(p => p.split(',').map(Number));

  const org = origemDoRecorte();
  if (!org) { alert('Pinte os limites da hunt antes de salvar.'); return null; }
  const mons = monstrosDentro(org);

  return {
    id: +document.getElementById('huntId').value,
    nome: document.getElementById('huntNome').value,
    obelisco: hunt.obelisco, inicio: hunt.inicio,
    andares: Object.keys(lim).map(Number).sort((a, b) => a - b),
    origemRecorte: org,
    bbox: bbox(),
    // relativa ao recorte: e' o que o catalogo.lua do servidor consome
    inicioRelativo: hunt.inicio
      ? { x: hunt.inicio.x - org.x, y: hunt.inicio.y - org.y, z: hunt.inicio.z }
      : null,
    monstros: mons.porAndar,
    totalMonstros: mons.total,
    monstrosPorTipo: contagemPorTipo(mons),
    limites: lim,
    automatico: hunt.automatico || undefined,
    gerado: new Date().toISOString().slice(0, 19),
  };
}

function aplicarHunt(d) {
  // Guarda a hunt que estava aberta antes de trocar. Sem isto, abrir outra
  // pela lista ou por arquivo apagava a marcacao anterior sem salvar: ela nao
  // passava pelo trocarHunt, que e' quem salvava. Some sem aviso, e so' se
  // percebe quando o id antigo volta vazio.
  if ((d.id ?? 0) !== huntAtual) guardarHunt();
  huntAtual = d.id ?? 0;
  document.getElementById('huntId').value = huntAtual;
  // marcacao antiga pode ter sido salva sem nome; o catalogo preenche
  document.getElementById('huntNome').value =
    d.nome || (nomeDoCatalogo(huntAtual) || '');
  hunt.obelisco = d.obelisco || null;
  hunt.inicio = d.inicio || null;
  // guarda de onde a hunt veio: e' o que distingue "contornada sozinha" de
  // "desenhada na mao" quando ela for aprovada
  hunt.automatico = d.automatico || null;
  hunt.limites = {};
  for (const [k, arr] of Object.entries(d.limites || {})) {
    const s = setDo(k);
    for (const p of arr) s.add(Array.isArray(p) ? p[0] + ',' + p[1] : p);
  }
  // A marcacao vem antes do obelisco de proposito. O obelisco fica FORA da
  // hunt (e' a entrada), entao pular para ele numa hunt de subsolo deixa a
  // tela na superficie e a troca de id passa despercebida -- parece que nada
  // mudou. O que responde "onde e' essa hunt" e' a area pintada.
  if (!irParaMarcacao()) {
    const alvo = d.obelisco || d.inicio;
    if (alvo) { camX = alvo.x - 60; camY = alvo.y - 40; z = alvo.z; selAndar.value = z; }
  }
  atualizarPainel(); desenhar();
}

function nomeDoCatalogo(id) {
  const h = (window.ATLAS_HUNTS || []).find(x => x.id === id);
  return h ? h.nome : '';
}

function irParaMarcacao() {
  // Vai para o andar com mais tiles marcados e centraliza na caixa dele.
  // Devolve false quando nao ha nada pintado, para quem chamou decidir.
  let melhor = null;
  for (const [k, s] of Object.entries(hunt.limites))
    if (s.size && (melhor === null || s.size > hunt.limites[melhor].size)) melhor = k;
  if (melhor === null) return false;

  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const p of hunt.limites[melhor]) {
    const [x, y] = p.split(',').map(Number);
    if (x < x0) x0 = x;
    if (y < y0) y0 = y;
    if (x > x1) x1 = x;
    if (y > y1) y1 = y;
  }
  const nz = +melhor;
  if (andares.includes(nz)) { z = nz; selAndar.value = z; }
  camX = ((x0 + x1) >> 1) - 40;
  camY = ((y0 + y1) >> 1) - 30;
  return true;
}

function importar(input) {
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { aplicarHunt(JSON.parse(r.result)); }
                     catch (e) { alert('JSON inválido: ' + e.message); } };
  r.readAsText(f);
}

function carregarExemplo() { aplicarHunt(ATLAS_EXEMPLO); }

// ------------------------------------------- hunts contornadas sozinhas
// Vem do achar_hunts.py. Sao conferencia, nao verdade: entram no mapeador
// como qualquer outra marcacao e podem ser corrigidas e re-exportadas.
let automaticas = [];
async function listarAutomaticas() {
  const sel = document.getElementById('selAuto');
  const info = document.getElementById('infoAuto');
  try {
    if (!automaticas.length) automaticas = await (await fetch('/automaticas')).json();
  } catch (e) { info.textContent = 'não consegui ler a pasta: ' + e.message; return; }
  const f = document.getElementById('filtroConf').value;
  const vis = automaticas.filter(h => !f || h.confianca === f);
  sel.innerHTML = vis.map(h =>
    `<option value="${h.arquivo}">[${h.id}] ${h.nome} — ${h.tiles} tiles, ${h.andares.length}º</option>`
  ).join('');
  info.textContent = `${vis.length} de ${automaticas.length} hunts`;
}

async function abrirAutomatica() {
  const arq = document.getElementById('selAuto').value;
  if (!arq) return;
  const info = document.getElementById('infoAuto');
  try {
    const d = await (await fetch('/automaticas/' + encodeURIComponent(arq))).json();
    aplicarHunt(d);
    const a = d.automatico || {};
    info.textContent = `${d.nome} — ${d.totalMonstros} monstros dentro, pureza ${a.pureza}%, `
      + `confiança ${a.confianca}. Esperava: ${(a.especiesEsperadas || []).join(', ')}`;
    // o reposicionamento ja acontece dentro do aplicarHunt
  } catch (e) { info.textContent = 'falhou: ' + e.message; }
}

// ---------------------------------------------------------- hunts salvas
// Rascunho: o que o botao Salvar gravou. Ficam separadas das aprovadas de
// proposito, mas faltava a ponte -- dava para salvar e nao havia como levar
// para as aprovadas sem reabrir tudo na mao.
async function listarSalvas() {
  const sel = document.getElementById('selSalva');
  const info = document.getElementById('infoSalva');
  try {
    const lista = await (await fetch('/salvas')).json();
    sel.innerHTML = lista.map(h => {
      const falta = [!h.temObelisco && 'obelisco', !h.temInicio && 'início'].filter(Boolean);
      return `<option value="${h.arquivo}">[${h.id}] ${h.nome} — ${h.tiles} tiles`
           + (falta.length ? ` (falta ${falta.join(' e ')})` : '') + `</option>`;
    }).join('');
    info.textContent = lista.length ? `${lista.length} rascunho(s)` : 'nenhum rascunho';
  } catch (e) { info.textContent = 'não consegui ler a pasta: ' + e.message; }
}

async function abrirSalva() {
  const arq = document.getElementById('selSalva').value;
  if (!arq) return;
  const info = document.getElementById('infoSalva');
  try {
    aplicarHunt(await (await fetch('/salvas/' + encodeURIComponent(arq))).json());
    info.textContent = 'aberta: ' + arq;
  } catch (e) { info.textContent = 'falhou: ' + e.message; }
}

async function aprovarSalva() {
  const arq = document.getElementById('selSalva').value;
  if (!arq) return;
  const info = document.getElementById('infoSalva');
  try {
    // manda o arquivo como esta', sem passar pela tela: aprovar nao deveria
    // depender de a hunt certa estar aberta
    const doc = await (await fetch('/salvas/' + encodeURIComponent(arq))).json();
    const r = await (await fetch('/revisar', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(doc),
    })).json();
    info.textContent = r.erro ? 'não aprovou: ' + r.erro
      : `aprovada como #${r.numero}` + (r.substituiu ? ' (atualizou a anterior)' : '');
    if (!r.erro) listarRevisadas();
  } catch (e) { info.textContent = 'não aprovou: ' + e.message; }
}

// --------------------------------------------------------- hunts aprovadas
// As que ja foram conferidas e podem virar instancia. Numeracao propria e
// sequencial: a planilha tem 525 linhas e so' um punhado vira hunt de
// verdade, entao numerar por ela deixaria buracos e nao diria nada sobre a
// ordem de implementacao. Vale tanto para as contornadas sozinhas quanto
// para as desenhadas na mao -- o que muda e' so o campo `origem`.
async function listarRevisadas() {
  const sel = document.getElementById('selRev');
  const info = document.getElementById('contaRev');
  try {
    const lista = await (await fetch('/revisadas')).json();
    sel.innerHTML = lista.map(h =>
      `<option value="${h.arquivo}">#${h.numero} ${h.nome} — ${h.tiles} tiles</option>`
    ).join('');
    const semInicio = lista.filter(h => !h.temInicio).length;
    info.textContent = lista.length
      ? `${lista.length} aprovada(s)` + (semInicio ? `, ${semInicio} sem início` : '')
      : 'nenhuma ainda';
  } catch (e) { info.textContent = 'não consegui ler a pasta: ' + e.message; }
}

async function abrirRevisada() {
  const arq = document.getElementById('selRev').value;
  if (!arq) return;
  const info = document.getElementById('infoRev');
  try {
    const d = await (await fetch('/revisadas/' + encodeURIComponent(arq))).json();
    aplicarHunt(d);
    const r = d.revisada || {};
    info.textContent = `#${r.numero} ${d.nome} — aprovada em ${(r.em || '').slice(0, 10)}`
      + `, origem ${r.origem || '?'}`;
  } catch (e) { info.textContent = 'falhou: ' + e.message; }
}

async function marcarRevisada() {
  const saida = montarSaida();
  if (!saida) return;
  const info = document.getElementById('infoRev');
  // o obelisco e o inicio nao saem do mapa, sao escolha de quem desenha --
  // avisar aqui evita mandar para o servidor uma hunt sem porta de entrada
  if (!saida.obelisco || !saida.inicio) {
    info.textContent = 'falta ' + (!saida.obelisco ? 'marcar o obelisco' : '')
      + (!saida.obelisco && !saida.inicio ? ' e ' : '')
      + (!saida.inicio ? 'marcar o início' : '') + ' antes de aprovar.';
    return;
  }
  try {
    const r = await (await fetch('/revisar', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(saida),
    })).json();
    info.textContent = r.erro ? 'não aprovou: ' + r.erro
      : `aprovada como #${r.numero}` + (r.substituiu ? ' (atualizou a anterior)' : '')
        + ` em ${r.pasta}`;
    if (!r.erro) listarRevisadas();
  } catch (e) { info.textContent = 'não aprovou: ' + e.message; }
}

// ------------------------------------------------------- troca de hunt
// Cada id guarda a propria marcacao. Sem isto, trocar de hunt mantinha o
// que ja estava pintado e o JSON da hunt nova saia com os limites da
// anterior -- um erro silencioso, que so apareceria ao usar o arquivo.
//
// Fica tambem no localStorage: sao horas de trabalho pintando tile, e
// fechar a aba sem querer nao pode custar isso.
const CHAVE_ARMAZEM = 'mapeador.hunts.v1';
let huntAtual = 0;

function instantaneo() {
  const lim = {};
  for (const [k, s] of Object.entries(hunt.limites))
    if (s.size) lim[k] = [...s];
  return { id: huntAtual, nome: document.getElementById('huntNome').value,
           obelisco: hunt.obelisco, inicio: hunt.inicio, limites: lim,
           automatico: hunt.automatico || undefined };
}

function armazem() {
  try { return JSON.parse(localStorage.getItem(CHAVE_ARMAZEM)) || {}; }
  catch (e) { return {}; }
}

function guardarHunt() {
  const tudo = armazem();
  const s = instantaneo();
  // nao guarda hunt intocada: senao um id digitado por engano viraria
  // entrada permanente
  if (!s.obelisco && !s.inicio && !Object.keys(s.limites).length)
    delete tudo[huntAtual];
  else
    tudo[huntAtual] = s;
  try { localStorage.setItem(CHAVE_ARMAZEM, JSON.stringify(tudo)); }
  catch (e) { /* cota estourada: segue sem salvar, nada se perde na sessao */ }
}

function trocarHunt(novo) {
  if (novo === huntAtual) return;
  guardarHunt();
  huntAtual = novo;
  const salvo = armazem()[novo];
  if (salvo) {
    aplicarHunt(salvo);
  } else if (novo === 0) {
    carregarExemplo();                 // id 0 e' o exemplo dos ciclopes
  } else {
    hunt.obelisco = hunt.inicio = null;
    hunt.limites = {};
    document.getElementById('huntNome').value = nomeDoCatalogo(novo);
    atualizarPainel(); desenhar();
  }
  document.getElementById('huntId').value = novo;
}

// Espera parar de digitar: o oninput dispara letra por letra, e trocar em
// "1" a caminho de "12" criaria uma hunt 1 fantasma a cada digitacao.
let trocaAdiada = 0;
const campoId = document.getElementById('huntId');
campoId.oninput = e => {
  const n = nomeDoCatalogo(+e.target.value);
  if (n) document.getElementById('huntNome').value = n;
  clearTimeout(trocaAdiada);
  trocaAdiada = setTimeout(() => trocarHunt(+campoId.value || 0), 700);
};
campoId.onchange = () => { clearTimeout(trocaAdiada); trocarHunt(+campoId.value || 0); };

// salva ao marcar e ao sair, para o trabalho nao depender de trocar de hunt
addEventListener('beforeunload', guardarHunt);

addEventListener('resize', desenhar);

// ------------------------------------------------------------------- boot
// Em modo servidor os dados chegam por HTTP; em modo atlas ja vieram no
// <script> embutido. O resto do codigo nao muda.
const MODO_SERVIDOR = (typeof ATLAS_MODO_SERVIDOR !== 'undefined');

async function iniciar() {
  if (MODO_SERVIDOR) {
    const d = await (await fetch('/dados')).json();
    LADO = d.bloco;
    window.ATLAS_AREAS = d.areas;
    window.ATLAS_MONSTROS = d.monstros;
    window.ATLAS_HUNTS = d.hunts;
    window.ATLAS_EXEMPLO = d.exemplo;
    montarAndares();
    indexarMonstros();
  }
  setFerr(null);
  // retoma de onde parou: se ha marcacao salva, ela vale mais que o exemplo
  const salvas = armazem();
  const ids = Object.keys(salvas).map(Number).sort((a, b) => a - b);
  if (ids.length) {
    aplicarHunt(salvas[ids[ids.length - 1]]);
    document.getElementById('aviso').textContent =
      `Retomado: ${ids.length} hunt(s) marcada(s) nesta máquina (${ids.join(', ')}).`;
  } else {
    carregarExemplo();
  }
  if (MODO_SERVIDOR) { listarAutomaticas(); listarRevisadas(); listarSalvas(); }
}
iniciar();
</script>
